<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gemini 2.5 Pro Demo</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="mb-4 text-center">Gemini 2.5 Pro Demo</h1>

    <div class="card shadow-sm">
      <div class="card-body">
        <!-- Text Prompt -->
        <div class="mb-3">
          <label for="prompt" class="form-label">Your Question</label>
          <textarea id="prompt" class="form-control" rows="3">What is in this image?</textarea>
        </div>

        <!-- Image/File Upload -->
        <div class="mb-3">
          <label for="file" class="form-label">Attach an Image or File</label>
          <input type="file" id="file" class="form-control" accept="image/*,.txt,.pdf">
        </div>

        <!-- Submit -->
        <button class="btn btn-primary w-100" onclick="sendMessage()">Send to Gemini</button>

        <!-- Response -->
        <div class="mt-4">
          <h5>Response:</h5>
          <pre id="output" class="bg-dark text-light p-3 rounded" style="min-height:120px;"></pre>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const userPrompt = document.getElementById("prompt").value;
      const fileInput = document.getElementById("file");
      const output = document.getElementById("output");
      output.textContent = "Thinking...";

      let content = [{ type: "text", text: userPrompt }];

      // If a file is uploaded
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const base64 = await toBase64(file);

        if (file.type.startsWith("image/")) {
          // Add as image
          content.push({
            type: "image_url",
            image_url: { url: base64 }
          });
        } else {
          // Add as text file (fallback for PDF/txt)
          content.push({
            type: "text",
            text: `Uploaded file (${file.name}) content in Base64:\n${base64.substring(0, 500)}...`
          });
        }
      }

      try {
        const res = await fetch("/api/chat", {   // Proxy endpoint
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "google/gemini-2.5-pro-exp-03-25",
            messages: [{ role: "user", content }]
          })
        });

        const data = await res.json();
        output.textContent = data?.choices?.[0]?.message?.content ?? "No response";
      } catch (err) {
        output.textContent = "Error: " + err.message;
      }
    }

    // Convert file to Base64 Data URL
    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
      });
    }
  </script>
</body>
</html>
